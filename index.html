<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pengingat-vite</title>
    
  </head>
  <body>
    <div id="auth-container" class="auth-container">
        <div id="login-view">
            <h2>💕 Login 💕</h2>
            <input type="email" id="login-email" placeholder="Email Kamu">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-button">Login</button>
            <p>Belum punya akun? <a href="#" id="show-register">Daftar di sini</a></p>
        </div>
        <div id="register-view" style="display: none;">
            <h2>✨ Buat Akun Baru ✨</h2>
            <input type="email" id="register-email" placeholder="Email Kamu">
            <input type="password" id="register-password" placeholder="Password">
            <button id="register-button">Daftar</button>
            <p>Sudah punya akun? <a href="#" id="show-login">Login di sini</a></p>
        </div>
    </div>

    <div id="app-container" class="container" style="display: none;">
        <div class="header">
            <h1>✨Pengatur Jadwalmu✨</h1>
            <div class="user-info">
                <span id="user-email"></span>
                <button id="logout-button">Logout</button>
            </div>
        </div>
        
        <p>Atur jadwalmu disini sayang!</p>

        <form id="reminder-form">
            <div class="form-group">
                <input type="text" id="task-input" placeholder="Tulis pengingat manis di sini..." required>
            </div>
            <div class="form-group">
                <input type="datetime-local" id="time-input" required>
            </div>
            <button type="submit">🌸 Atur Jadwalmu</button>
        </form>

        <div class="task-list-container">
            <h2>🎀 Daftar Tugasmu, Kerjain ya! 🎀</h2>
            <ul id="task-list"></ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="src/main.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
